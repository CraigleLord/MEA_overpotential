                            - /url: "#support-information-section"
                          - text: (Supporting Information) summarizes the sizes of Pt
                          - subscript [ref=e420]: "3"
                          - text: Co i-NPs loaded on different supports at various synthesis temperatures. These sizes demonstrate that few supports can uniformly disperse Pt and Co species to form small-sized Pt
                          - subscript [ref=e421]: "3"
                          - text: Co alloys at ultrahigh temperatures, a feat achieved by Te─C in this study. This further indicates that the Te anchoring strategy enhances the interactions between Pt
                          - subscript [ref=e422]: "3"
                          - text: Co i-NPs and the Te─C supports.
                        - paragraph [ref=e423]:
                          - text: Atomic-resolution high-angle annular dark-field scanning transmission electron microscope (HAADF-STEM) was used to acquire more detailed structural information regarding Pt
                          - subscript [ref=e424]: "3"
                          - text: Co/Te-C. In Figure
                          - link "1g" [ref=e425] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0001"
                          - text: ", a 4-nm Pt"
                          - subscript [ref=e426]: "3"
                          - text: Co i-NP is shown along the [001] direction. The atomic number contrast imaging of HAADF images reflects the Z-contrast of materials, resulting in Pt columns exhibiting higher intensity than Co columns.
                          - superscript [ref=e427]: "["
                          - superscript [ref=e429]:
                            - link "Reference 36 - Nat. Mater." [ref=e430] [cursor=pointer]:
