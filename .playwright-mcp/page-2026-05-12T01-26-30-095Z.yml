                              - text: "34"
                          - superscript [ref=e411]: "]"
                          - text: Although the Pt
                          - subscript [ref=e412]: "3"
                          - text: Co i-NPs formed on the three doped supports exhibited varying degrees of metal sintering, all were less severe than those observed in the case of Pt
                          - subscript [ref=e413]: "3"
                          - text: Co/C, indicating that heteroatom doping likely results in stronger MSIs that mitigate some metal sintering.
