                            - /url: "#adfm202408383-fig-0002"
                          - text: showed that the (111) diffraction peak became sharper as the temperature increased, indicating that the size of the metal particles in both Pt
                          - subscript [ref=e447]: "3"
                          - text: Co/Te-C and Pt
                          - subscript [ref=e448]: "3"
                          - text: Co/C was gradually growing, and it was clear that the particle size in Pt
                          - subscript [ref=e449]: "3"
                          - text: Co/C grew dramatically, increasing to nearly 7 nm after holding for 6 h at 700 °C (Figure
                          - link "2d" [ref=e450] [cursor=pointer]:
