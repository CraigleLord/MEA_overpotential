                          - text: Co/Te-C (Figure
                          - link "2c" [ref=e452] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0002"
                          - text: ). These results demonstrated that Te doping significantly enhanced the resistance to sintering of Pt
                          - subscript [ref=e453]: "3"
                          - text: Co/Te-C catalysts during high-temperature annealing, which was consistent with the XRD and TEM findings. In addition, the intensity of the characteristic superlattice peak (110) reflects the evolution process of ordered intermetallic compounds,
                          - superscript [ref=e454]: "["
                          - superscript [ref=e456]:
