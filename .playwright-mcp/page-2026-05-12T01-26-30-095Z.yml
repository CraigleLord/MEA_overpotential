                        - paragraph [ref=e403]:
                          - text: Severe metal sintering was observed during the synthesis of Pt
                          - subscript [ref=e404]: "3"
                          - text: Co/C, attributed to the weak interactions between Pt
                          - subscript [ref=e405]: "3"
                          - text: Co i-NPs and the C support, the poor thermal stability allowing particle size growth through two pathways driven by high-temperature, particle migration and coalescence (PMC), and Ostwald ripening (OR).
