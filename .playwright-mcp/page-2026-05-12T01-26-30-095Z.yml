                          - text: As depicted in Figure
                          - link "S11" [ref=e433] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: (Supporting Information), along the [001] axis, the unit cell comprises a Co column surrounded by Pt columns at the vertices and edges of each unit cell, arranged periodically in the form of a square matrix. Fast Fourier transform (FFT) patterns (Figure
                          - link "1h" [ref=e434] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0001"
                          - text: ) and alternating intensity profiles (Figure
                          - link "1i" [ref=e435] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0001"
                          - text: ) confirm the ordered structures of Pt
                          - subscript [ref=e436]: "3"
                          - text: Co/Te─C, consistent with the XRD results. EDS mapping (Figure
                          - link "1j" [ref=e437] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0001"
                          - text: ; Figure
                          - link "S12" [ref=e438] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information) indicates that Pt and Co are uniformly distributed within the NPs and that the Pt/Co atomic ratio is close to the ideal ratio (3/1 for L1"
                          - subscript [ref=e439]: "2"
                          - text: Pt
                          - subscript [ref=e440]: "3"
                          - text: Co i-NPs). Furthermore, most residual Te species were found enriched in the regions containing Pt
                          - subscript [ref=e441]: "3"
                          - text: Co i-NPs, indicating a strong interaction between Pt
                          - subscript [ref=e442]: "3"
                          - text: Co i-NPs and the Te-doped support.
                        - paragraph [ref=e443]:
                          - text: To explore more details of particle size growth and ordered intermetallic nanoparticles, in-situ high-temperature XRD testing was performed on Pt
                          - subscript [ref=e444]: "3"
                          - text: Co/Te-C and Pt
                          - subscript [ref=e445]: "3"
                          - text: Co/C precursors. Figure
