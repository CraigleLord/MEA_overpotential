                - article [ref=e165]:
                  - generic [ref=e167]:
                    - heading "Abstract" [level=2] [ref=e168]
                    - paragraph [ref=e170]:
                      - text: Highly active Pt-based intermetallic nanoparticles (i-NPs) loaded on stable supports have garnered considerable interest as promising oxygen reduction reaction (ORR) catalysts for proton-exchange-membrane fuel cells (PEMFCs). Herein, thermostable tellurium (Te) is vapor-deposited onto commercial conductive carbon to anchor high-temperature-synthesized Pt
                      - subscript [ref=e171]: "3"
                      - text: Co i-NPs. Advanced characterization and density functional theory (DFT) calculations demonstrate that the binding energy of Pt 4f and Co 2p shift positively by 0.12 and 0.95 eV after the introduction of Te in carbon support, promoting the formation of Pt─Te bonds, which enhances the metal–support interactions (MSIs) in Pt
                      - subscript [ref=e172]: "3"
                      - text: Co/Te-C (with a more negative binding energy of −10.28 eV). The average size of well-dispersed Pt
                      - subscript [ref=e173]: "3"
                      - text: Co i-NPs (≈3.9 nm) on Te─C is considerably smaller than that of Pt
                      - subscript [ref=e174]: "3"
                      - text: Co i-NPs (≈9.1 nm) on commercial carbon. The specific activity of Pt
                      - subscript [ref=e175]: "3"
                      - text: Co/Te-C decreases by only 1.5% after 100,000 ultra-long voltage-accelerated cycles, while the morphology remains almost unchanged. The membrane electrode assembly using Pt
                      - subscript [ref=e176]: "3"
                      - text: Co/Te-C as a cathode demonstrates impressive activity (power density of 2.32 W cm
                      - superscript [ref=e177]: −2
                      - text: "@4 A cm"
                      - superscript [ref=e178]: −2
                      - text: and mass activity of 0.50 A mg
                      - subscript [ref=e179]: Pt
                      - superscript [ref=e180]: −1
                      - text: "@0.9 V) and robust durability (mass activity@0.9 V loss of 26% after 30,000 cycles with intact L1"
                      - subscript [ref=e181]: "2"
                      - text: ordered structure) in H
                      - subscript [ref=e182]: "2"
                      - text: –O
                      - subscript [ref=e183]: "2"
                      - text: operation, significantly exceeding the DOE 2025 requirements.
                  - generic [ref=e184]:
                    - generic [ref=e185]:
                      - heading "1 Introduction" [level=2] [ref=e186]
                      - paragraph [ref=e187]:
                        - text: Proton-exchange-membrane fuel cells (PEMFCs) are considered a promising energy conversion technology that converts hydrogen into electricity with high efficiency and energy density producing only unpolluted water.
                        - superscript [ref=e188]: "["
                        - superscript [ref=e190]:
                          - link "Reference 1 - ACS Catal." [ref=e191] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0001"
                            - text: "1"
                          - text: "-"
                          - link "Reference 4 - Appl Catal B." [ref=e192] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0004"
                            - text: "4"
                        - superscript [ref=e193]: "]"
                        - text: The performance and lifetime of PEMFCs are primarily determined based on the activity and durability of cathode catalysts owing to the sluggish kinetics of the oxygen reduction reaction (ORR).
                        - superscript [ref=e194]: "["
                        - superscript [ref=e196]:
                          - link "Reference 5 - Adv. Mater." [ref=e197] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0005"
                            - text: "5"
                        - superscript [ref=e198]: "]"
                        - text: Historically, nanosized Pt particles loaded on conductive carbon supports have been demonstrated to boost ORR kinetics.
                        - superscript [ref=e199]: "["
                        - superscript [ref=e201]:
                          - link "Reference 6 - Angew. Chem., Int. Ed." [ref=e202] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0006"
                            - text: "6"
                        - superscript [ref=e203]: "]"
                        - text: However, the high cost and low durability of Pt-based cathode catalysts restrict the large-scale commercialization of PEMFCs.
                        - superscript [ref=e204]: "["
                        - superscript [ref=e206]:
                          - link "Reference 7 - Adv. Mater." [ref=e207] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0007"
                            - text: "7"
                        - superscript [ref=e208]: "]"
                        - text: Consequently, considerable efforts have been devoted to developing highly active Pt-based nanoparticles stably loaded on carbon supports to promote mass activity and prevent metal degradation, although this remains highly challenging.
                      - paragraph [ref=e209]:
                        - text: Alloying Pt with 3d transition metals, such as Co, Mn, or Ni, can regulate the electronic structure of Pt to enhance its inherent ORR activity, thereby reducing Pt consumption. Moreover, ordered Pt-based intermetallic nanoparticles (i-NPs) exhibit a periodic arrangement of atoms within the crystal, resulting in ligand and strain effects as well as thermodynamic stability for excellent ORR performance.
                        - superscript [ref=e210]: "["
                        - superscript [ref=e212]:
                          - link "Reference 8 - Angew. Chem., Int. Ed." [ref=e213] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0008"
                            - text: "8"
                        - superscript [ref=e214]: "]"
                        - text: However, it is worth mentioning that synthesizing ordered Pt-based i-NPs typically requires high temperatures to facilitate atomic diffusion and ordering. Furthermore, high-temperature annealing accelerates metal sintering producing larger i-NPs with increased size distributions,
                        - superscript [ref=e215]: "["
                        - superscript [ref=e217]:
                          - link "Reference 9 - Adv. Mater." [ref=e218] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0009"
                            - text: "9"
                          - text: ","
                          - link "Reference 10 - Nat. Mater." [ref=e219] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0010"
                            - text: "10"
                        - superscript [ref=e220]: "]"
                        - text: resulting in reduced electrochemical surface areas (ECSAs) and mass activity.
                        - superscript [ref=e221]: "["
                        - superscript [ref=e223]:
                          - link "Reference 11 - J. Electroanal. Chem." [ref=e224] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0011"
                            - text: "11"
                          - text: "-"
                          - link "Reference 13 - Nano Lett." [ref=e225] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0013"
                            - text: "13"
                        - superscript [ref=e226]: "]"
                        - text: Therefore, an effective strategy to promote thermal stability for suppressed sintering is essential for forming small-sized and highly-ordered intermetallic structures.
                      - paragraph [ref=e227]:
                        - text: Catalyst supports play a crucial role in uniformly dispersing metal particles, and interacting with them, thereby influencing catalytic activity and durability.
                        - superscript [ref=e228]: "["
                        - superscript [ref=e230]:
                          - link "Reference 14 - Nat. Catal." [ref=e231] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0014"
                            - text: "14"
                          - text: "-"
                          - link "Reference 16 - Science" [ref=e232] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0016"
                            - text: "16"
                        - superscript [ref=e233]: "]"
                        - text: Carbon materials are a promising option for supporting Pt-based NPs owing to their good conductivity and high specific surface area.
                        - superscript [ref=e234]: "["
                        - superscript [ref=e236]:
                          - link "Reference 17 - Chem. Rev." [ref=e237] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0017"
                            - text: "17"
                        - superscript [ref=e238]: "]"
                        - text: However, the weak interactions between Pt-based NPs and pure carbon supports often leads to metal sintering during thermal annealing as well as dissolution, migration, and detachment under harsh catalytic conditions.
                        - superscript [ref=e239]: "["
                        - superscript [ref=e241]:
                          - link "Reference 18 - Angew. Chem., Int. Ed." [ref=e242] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0018"
                            - text: "18"
                        - superscript [ref=e243]: "]"
                        - text: Modifying carbon support can improve metal–support interactions (MSIs) and regulate the electronic structure of Pt-based NPs, making modified carbon a viable option for constructing thermal and electrochemical stability to enhance the resistance of metal sintering and degradation for superior activity and durability.
                        - superscript [ref=e244]: "["
                        - superscript [ref=e246]:
                          - link "Reference 19 - Angew. Chem., Int. Ed." [ref=e247] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0019"
                            - text: "19"
                        - superscript [ref=e248]: "]"
                        - text: For instance, Liang et al.
                        - superscript [ref=e249]: "["
                        - superscript [ref=e251]:
                          - link "Reference 20 - Science" [ref=e252] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0020"
                            - text: "20"
                        - superscript [ref=e253]: "]"
                        - text: employed Si NPs as templates to create porous S-doped carbon (S-C), which exhibited excellent resistance to metal sintering at high-temperature annealing of Pt-based i-NPs, with an average size of less than 5 nm. Sun et al.
                        - superscript [ref=e254]: "["
                        - superscript [ref=e256]:
                          - link "Reference 21 - Energy Environ. Sci." [ref=e257] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0021"
                            - text: "21"
                        - superscript [ref=e258]: "]"
                        - text: introduced P-O functional groups into the Ketjen black to anchor PtCo alloy NPs. The P-O functional group effectively inhibits the growth of PtCo NPs and enhances electrochemical stability owing to the strong interaction between Pt in NPs and O in the carbon support. Group VIA elements (such as S, Se, and Te) tend to get electrons, and when doped into carbon supports to support metal species, the electronic transfers between metal species and carbon supports can be regulated, thereby enhancing the metal-support interactions. Compared with S and Se, semimetal Te exhibits stronger metallicity and higher electrical conductivity (≈1000 S m
                        - superscript [ref=e259]: −1
                        - text: ) owing to its lowest electronegativity,
                        - superscript [ref=e260]: "["
                        - superscript [ref=e262]:
                          - link "Reference 22 - Nano Res. Energy" [ref=e263] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0022"
                            - text: "22"
                        - superscript [ref=e264]: "]"
                        - text: which is beneficial to improve the conductivity of the catalyst for efficient electrocatalysis. Additionally, the superior acid resistance of Te is essential for ensuring the chemical stability of the catalyst under operational conditions.
                        - superscript [ref=e265]: "["
                        - superscript [ref=e267]:
                          - link "Reference 23 - Appl. Catal., A" [ref=e268] [cursor=pointer]:
                            - /url: "#adfm202408383-bib-0023"
                            - text: "23"
                        - superscript [ref=e269]: "]"
                      - paragraph [ref=e270]:
                        - text: Herein, we developed Te-C supports using a facile vapor deposition method and proposed a thermostable Te anchoring strategy for Pt
                        - subscript [ref=e271]: "3"
                        - text: Co i-NPs catalysts with robust thermal and electrochemical stability. Characterization of electronic and coordination structures as well as density functional theory (DFT) calculations revealed that the binding energy of Pt 4f and Co 2p shifted positively by 0.12 and 0.95 eV in Pt
                        - subscript [ref=e272]: "3"
                        - text: Co/Te-C with a more negative binding energy of −10.28 eV for enhanced MSIs, resulting in the formation of Pt─Te bonds, which contributed to resist sintering during high-temperature annealing and degradation under operational conditions of the Pt
                        - subscript [ref=e273]: "3"
                        - text: Co i-NPs. DFT calculations also confirmed that the adjustment of the electronic structure of Pt optimized the desorption of
                        - superscript [ref=e274]: ∗
                        - text: OH, thus promoting the intrinsic activity of Pt
                        - subscript [ref=e275]: "3"
                        - text: Co/Te-C. Electronic structure-modified Pt
                        - subscript [ref=e276]: "3"
                        - text: Co i-NPs on Te─C supports with an average size of 3.9 nm resulted in high activity in H
                        - subscript [ref=e277]: "2"
                        - text: –O
                        - subscript [ref=e278]: "2"
                        - text: fuel cell (mass activity of 0.50 A mg
                        - subscript [ref=e279]: Pt
                        - superscript [ref=e280]: −1
                        - text: and power density of 2.32 W cm
                        - superscript [ref=e281]: −2
                        - text: "@4 A cm"
                        - superscript [ref=e282]: −2
                        - text: ). Significantly, the high Te retention after annealing (2.3 wt% in Pt
                        - subscript [ref=e283]: "3"
                        - text: Co/Te─C) with enhanced MSIs led to robust durability after 100000 voltage cycles (specific activity retention of 1.5% with almost unchanged morphology) in rotating disk electrode (RDE) tests and after 30000 voltage cycles (mass activity retention of 74% with intact L1
                        - subscript [ref=e284]: "2"
                        - text: ordered structure) in membrane electrode assembly (MEA) tests, considerably exceeding the DOE 2025 targets.
                    - generic [ref=e285]:
                      - heading "2 Results and Discussion" [level=2] [ref=e286]
                      - generic [ref=e287]:
                        - heading "2.1 Carbon Support Modification and Pt3Co i-NPs Synthesis" [level=3] [ref=e288]:
                          - text: 2.1 Carbon Support Modification and Pt
                          - subscript [ref=e289]: "3"
                          - text: Co i-NPs Synthesis
                        - paragraph [ref=e290]:
                          - text: Figure
                          - link "1a" [ref=e291] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0001"
                          - text: illustrates the modification of the carbon support and the synthesis of ordered Pt
                          - subscript [ref=e292]: "3"
                          - text: Co i-NPs. Initially, three types of carbon supports were obtained by doping heteroatoms of Te, Se, and S into Ketjen black (EC-300J) via the chemical vapor deposition (CVD) method, named Te-doped carbon (Te─C), Se-doped carbon (Se─C), and S-doped carbon (S─C), respectively. Compared with wet impregnation and physical grind mixing, the CVD method is simple to modify near the surface with fewer operation processes for lower energy consumption, and does not use any toxic organic solvents, which is environmentally friendly. The EC-300J in the control sample was subjected to the same heat treatment without any doping. Subsequently, the Pt
                          - subscript [ref=e293]: "3"
                          - text: Co i-NPs were successfully synthesized on these modified carbon supports via wet impregnation and thermal annealing in a reductive atmosphere. Annealing at high temperatures was used to facilitate the alloying of Pt and Co with disordered intermetallic structures, while prolonged holding at low temperatures promoted the disorder-order transition for synthesizing highly ordered Pt
                          - subscript [ref=e294]: "3"
                          - text: Co intermetallic nanoparticles (see Supporting Information).
