                        - paragraph [ref=e584]:
                          - text: To explore the thermostability of Te, Se, and S, XPS spectra and ICP content of heteroatoms before and after annealing were performed. The XPS spectra of the heteroatoms in both the support and the corresponding catalyst were compared (Figure
                          - link "S16" [ref=e585] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information). The spectral signals of Te 3d, Se 3d, and S 2p are clearly observable in the three doped carbon supports. However, after high-temperature annealing for Pt"
                          - subscript [ref=e586]: "3"
                          - text: Co i-NPs formation on each support, the detection of Se 3d and S 2p signals in Pt
                          - subscript [ref=e587]: "3"
                          - text: Co/Se-C and Pt
                          - subscript [ref=e588]: "3"
                          - text: Co/S-C becomes challenging, while the Te 3d signal remains clearly visible in Pt
                          - subscript [ref=e589]: "3"
                          - text: Co/Te-C. Furthermore, the ratio of Te to Te
                          - superscript [ref=e590]: 4+
                          - text: decreases in Pt
                          - subscript [ref=e591]: "3"
                          - text: Co/Te-C, likely due to partial oxidation of Te during high-temperature annealing. Additionally, the Te 3d peak in Pt
                          - subscript [ref=e592]: "3"
                          - text: Co/Te-C exhibits a negative shift of 0.45 eV compared with the pristine Te-C, aligning with the positive shift of the Pt 4f and Co 2p peak in Pt
                          - subscript [ref=e593]: "3"
                          - text: Co/Te-C. Table
                          - link "S1" [ref=e594] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: (Supporting Information) reveals that despite high-temperature annealing, the Te content in the catalyst remains at 2.3%, followed by Se at 0.9%, and S at 0.2%, which is nearly depleted during the annealing process. Thus, due to the inherent thermostability of Te-C, a sufficient amount of Te remains in the catalyst to maintain the strong MSIs not only during synthesis but also in the practical operation of fuel cells.
