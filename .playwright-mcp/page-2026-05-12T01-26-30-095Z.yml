                          - text: (Supporting Information), the I
                          - subscript [ref=e350]: D
                          - text: /I
                          - subscript [ref=e351]: G
                          - text: values of the four carbon supports are ≈1.1, indicating similar defect structures among them. In addition, the surface contact angle test indicates that heteroatom doping can improve the hydrophobicity of carbon supports (Figure
                          - link "S9" [ref=e352] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information), which can alleviate the effect of water flooding at the fuel cell cathode on the catalytic performance of the catalyst when operating at high current densities."
