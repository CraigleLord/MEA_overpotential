                        - heading "2.2 Carbon Support Characterization" [level=3] [ref=e321]
                        - paragraph [ref=e322]:
                          - text: Four types of modified carbon supports were characterized via X-ray diffraction (XRD), scanning electron microscopy (SEM), transmission electron microscopy (TEM), energy-dispersive Xray spectroscopy (EDS) elemental mapping, X-ray photoelectron spectroscopy (XPS), N
                          - subscript [ref=e323]: "2"
                          - text: adsorption-desorption analysis and Raman spectra. For consistency, the amount of doping source was regulated to ensure that the mass of heteroatoms was equal across the three doped carbon supports, as determined via inductively coupled plasma-optical emission spectroscopy (ICP-OES) (Table
                          - link "S1" [ref=e324] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information). XRD patterns (Figure"
                          - link "S1" [ref=e325] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information) revealed no diffraction peaks of heteroatoms in Te─C, Se─C, and S─C, indicating that the heteroatoms may be uniformly dispersed in the form of single atoms in the corresponding carbon support. SEM images (Figure"
                          - link "S2" [ref=e326] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information) displayed the accumulation of carbon spheres with diameters ranging from 30 to 50 nm. TEM images and corresponding EDS mapping (Figures"
                          - link "S3–S5" [ref=e327] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information) showed that the heteroatoms (Te, Se, and S) were uniformly distributed on the corresponding carbon supports and did not form obvious particles. Moreover, it was clearly found that in the case of the same mass fraction, sulfur had the largest amount because of its smallest relative atomic mass among the three dopants. In the XPS spectra of the doped carbon supports, the peaks located at 574.5 and 584.8 eV in the Te 3d spectra, 56.0 and 56.8 eV in the Se 3d spectra, and 164.2 and 165.4 eV in the S 2p spectra can be assigned to Te─C bonds, Se─C bonds, and S─C bonds, respectively (Figure"
                          - link "S6" [ref=e328] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information). In addition, the signals of Te─O, Se─O, and S─O were also resolved in Te─C, Se─C, and S─C, respectively, indicating partial oxidation of these dopants in corresponding carbon supports."
                          - superscript [ref=e329]: "["
                          - superscript [ref=e331]:
                            - link "Reference 24 - Angew. Chem., Int. Ed." [ref=e332] [cursor=pointer]:
                              - /url: "#adfm202408383-bib-0024"
                              - text: "24"
                          - superscript [ref=e333]: "]"
                        - paragraph [ref=e334]:
                          - text: "N"
                          - subscript [ref=e335]: "2"
                          - text: adsorption-desorption results provided insights into the pore structure of the four carbon supports (Figure
                          - link "S7" [ref=e336] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: and Table
                          - link "S2" [ref=e337] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: ", Supporting Information). Table"
                          - link "S2" [ref=e338] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: (Supporting Information) shows that the specific surface areas of Te─C, Se─C, S─C, and C are 786, 767, 532, and 795 m
                          - superscript [ref=e339]: "2"
                          - text: g
                          - superscript [ref=e340]: −1
                          - text: ", respectively. The decrease in specific surface area for the three doped carbon supports may be attributed to the partial entry of heteroatoms into the nanopores of the original carbon, with the largest atomic ratio of sulfur atoms resulting in the largest reduction in the specific surface area of S─C supports, which is consistent with the results of EDS mapping. Figure"
                          - link "S7b" [ref=e341] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: (Supporting Information) demonstrates that there are more micropores in as-obtained carbon supports, as well as pores due to the accumulation of carbon spheres, which can be seen from the SEM results. The I
                          - subscript [ref=e342]: D
                          - text: /I
                          - subscript [ref=e343]: G
                          - text: ratio in Raman spectra can be used to elucidate the defects in as-prepared samples.
                          - superscript [ref=e344]: "["
                          - superscript [ref=e346]:
                            - link "Reference 25 - Adv. Funct. Mater." [ref=e347] [cursor=pointer]:
                              - /url: "#adfm202408383-bib-0025"
                              - text: "25"
                          - superscript [ref=e348]: "]"
                          - text: As shown in Figure
                          - link "S8" [ref=e349] [cursor=pointer]:
