                          - subscript [ref=e392]: "3"
                          - text: Co i-NPs. The average size of the Pt
                          - subscript [ref=e393]: "3"
                          - text: Co i-NPs distributed on the Te─C support was 4.2 nm. Small fractions of particles grew inevitably owing to the high-temperature annealing necessary to overcome the high energy barrier of atom diffusion and ordering in solid states,
                          - superscript [ref=e394]: "["
