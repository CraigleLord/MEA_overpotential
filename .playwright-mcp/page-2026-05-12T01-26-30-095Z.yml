                      - heading "3 Conclusion" [level=2] [ref=e867]
                      - paragraph [ref=e868]:
                        - text: A thermostable Te-modified carbon support stably loaded with highly active Pt
                        - subscript [ref=e869]: "3"
                        - text: Co i-NPs was both experimentally and theoretically validated. The introduction of Te enhanced electronic transfers and facilitated the formation of Pt─Te bonds between the metal and the support, which optimized the desorption of
                        - superscript [ref=e870]: ∗
                        - text: OH to increase intrinsic activity and displayed robust thermal and electrochemical stability to resist metal sintering and degradation. After the high-temperature alloying process, the average size of highly ordered Pt
                        - subscript [ref=e871]: "3"
                        - text: Co i-NPs in Pt
                        - subscript [ref=e872]: "3"
                        - text: Co/Te-C was 3.9 nm, with most Te atoms retained, leading to the SA of Pt
                        - subscript [ref=e873]: "3"
                        - text: Co/Te-C decayed by only 1.5% after 100000 voltage-accelerated cycles without significant morphological change. Notably, both the BOL and EOL performance indicators in the MEA test significantly surpassed the DOE 2025 targets. This study not only introduces a novel perspective for thermostable heteroatom anchoring but also paves the way for future research on Pt-based i-NP catalysts with satisfactory activity and durability in PEMFCs.
