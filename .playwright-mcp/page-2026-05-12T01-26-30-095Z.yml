                          - subscript [ref=e676]: "4"
                          - text: solution. Remarkably, Pt
                          - subscript [ref=e677]: "3"
                          - text: Co/Te-C exhibited robust durability, with 8 mV loss in E
                          - subscript [ref=e678]: 1/2
                          - text: ", 29.8% loss in ECSAs, 1.5% loss in SA, and 30% loss in MA after 100000 ultra-long ADTs (Figure"
