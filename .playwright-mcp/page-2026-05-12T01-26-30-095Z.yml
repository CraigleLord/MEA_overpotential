                        - paragraph [ref=e846]:
                          - text: The DFT calculation was employed to study the effect of four carbon supports on the ORR activity. Since acid leaching and secondary heat treatment removed unstable surface cobalt species, ORR occured mainly at the Pt site on the surface. Four atomic models were constructed, each featuring a graphene structure with two Te atoms, two Se atoms, two S atoms, and no dopant, integrated with a Pt(111) plane, denoted as Te-C@Pt(111), Se-C@Pt(111), S-C@Pt(111), and C@Pt(111). Additionally, various oxygen-containing intermediates (
                          - superscript [ref=e847]: ∗
                          - text: OOH,
                          - superscript [ref=e848]: ∗
                          - text: O, and
                          - superscript [ref=e849]: ∗
                          - text: OH) were incorporated into each model to simulate the real ORR process. Figure
                          - link "6d" [ref=e850] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0006"
                          - text: and Figure
                          - link "S25" [ref=e851] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: (Supporting Information) illustrate the
                          - superscript [ref=e852]: ∗
                          - text: OH adsorption in these models. The computational hydrogen electrode (CHE) method was utilized to predict the free energy evolution along the four-electron associative ORR pathway on the optimized models.
                          - superscript [ref=e853]: "["
                          - superscript [ref=e855]:
                            - link "Reference 52 - J. Am. Chem. Soc." [ref=e856] [cursor=pointer]:
                              - /url: "#adfm202408383-bib-0052"
                              - text: "52"
                          - superscript [ref=e857]: "]"
                          - text: As shown in Figure
                          - link "6e" [ref=e858] [cursor=pointer]:
                            - /url: "#adfm202408383-fig-0006"
                          - text: and Figure
                          - link "S26" [ref=e859] [cursor=pointer]:
                            - /url: "#support-information-section"
                          - text: (Supporting Information), the rate-determining step (RDS) of ORR in these systems is the desorption and hydrogenation of
                          - superscript [ref=e860]: ∗
                          - text: OH to produce H
                          - subscript [ref=e861]: "2"
                          - text: O. It was observed that the desorption of
                          - superscript [ref=e862]: ∗
                          - text: OH in Te-C@Pt(111) required the least free energy among the models, indicating that Te doping optimizes the desorption of
                          - superscript [ref=e863]: ∗
                          - text: OH and enhances ORR activity. Furthermore, the ORR activity of each catalyst was inferred from the magnitude of the limit potential, with Te-C@Pt(111), Se-C@Pt(111), S-C@Pt(111), and C@Pt(111) showing potentials of 0.64, 0.62, 0.61, and 0.58 V, respectively. These results theoretically confirm that Pt
                          - subscript [ref=e864]: "3"
                          - text: Co/Te-C exhibits the best ORR performance among the four Pt
                          - subscript [ref=e865]: "3"
                          - text: Co-based catalysts, aligning with experimental findings.
