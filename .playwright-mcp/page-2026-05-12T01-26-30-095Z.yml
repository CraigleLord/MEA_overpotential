                          - subscript [ref=e363]: "3"
                          - text: Co intermetallic phase (the characteristic superlattice peaks of ordered intermetallic structures are marked by special symbols), confirming the successful synthesis of ordered Pt
                          - subscript [ref=e364]: "3"
                          - text: Co i-NPs. Furthermore, the intensity ratio of the (110) peak to the (111) peak (I
